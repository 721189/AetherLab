[pytest]
testpaths = tests
markers =
    # Heavy integration tier: requires TEST_DATABASE_URL pointing at a real
    # PostgreSQL instance (e.g. a test container). Skipped otherwise.
    integration: PostgreSQL/Redis-backed integration tests
    # Live external-provider smoke tests. Opt-in only (RUN_PROVIDER_SMOKE=1)
    # so CI pushes never consume API quota.
    smoke: live external-provider contract tests
