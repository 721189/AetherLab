# Continuous Integration for AetherLab.
#
# Runs on every push to `main` and on every pull request. Three tiers:
#
#   backend-unit      FastAPI suite on SQLite (hermetic, every push)
#   backend-postgres  Integration tier against REAL PostgreSQL + Redis
#                     service containers -- migrations, constraints, cascades,
#                     token rotation and Redis-backed limiter/cache behaviour
#                     are continuously enforced, not just available locally.
#   frontend          Next.js type-check + production build

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend - pytest (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt was generated with `pip freeze > requirements.txt` on
      # Windows PowerShell, so it is UTF-16 encoded AND contains Windows-only
      # packages that do not exist on Linux; normalise/filter here. The
      # committed file stays authoritative for local Windows dev.
      - name: Normalise requirements.txt for Linux CI (UTF-16 -> UTF-8, drop Windows-only)
        working-directory: ./
        run: |
          python - <<'PY'
          import pathlib, re
          req = pathlib.Path("requirements.txt")
          raw = req.read_bytes()
          text = raw.decode("utf-16") if b"\x00" in raw else raw.decode("utf-8")
          drop_prefix = re.compile(
              r"^\s*(pywin32|pypiwin32|pywin32-setctime|wincertstore|winshell|windows-curses)[\w.\-]*\s*==",
              re.IGNORECASE,
          )
          lines = [
              ln for ln in text.splitlines()
              if ln.strip() and not drop_prefix.match(ln)
          ]
          req.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Install backend dependencies
        run: pip install --upgrade pip && pip install -r ../requirements.txt

      - name: Run unit/API test suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: aetherlab-ci-only-dev-secret-0123456789abcdef0123456789abcdef
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -v -m "not integration and not smoke"

  backend-postgres:
    name: Backend - integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aetherlab
          POSTGRES_PASSWORD: ci-secret
          POSTGRES_DB: aetherlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aetherlab -d aetherlab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalise requirements.txt for Linux CI (UTF-16 -> UTF-8, drop Windows-only)
        working-directory: ./
        run: |
          python - <<'PY'
          import pathlib, re
          req = pathlib.Path("requirements.txt")
          raw = req.read_bytes()
          text = raw.decode("utf-16") if b"\x00" in raw else raw.decode("utf-8")
          drop_prefix = re.compile(
              r"^\s*(pywin32|pypiwin32|pywin32-setctime|wincertstore|winshell|windows-curses)[\w.\-]*\s*==",
              re.IGNORECASE,
          )
          lines = [
              ln for ln in text.splitlines()
              if ln.strip() and not drop_prefix.match(ln)
          ]
          req.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Install backend dependencies
        run: pip install --upgrade pip && pip install -r ../requirements.txt

      # The full suite runs here so the whole app is validated against real
      # infrastructure; the integration tier additionally exercises PG-specific
      # constraints/cascades and the live Redis-backed limiter/cache.
      - name: Run full suite against PostgreSQL + Redis
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://aetherlab:ci-secret@localhost:5432/aetherlab_test
          TEST_DATABASE_URL: postgresql+psycopg://aetherlab:ci-secret@localhost:5432/aetherlab_test
          SECRET_KEY: aetherlab-ci-only-dev-secret-0123456789abcdef0123456789abcdef
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -v

  frontend:
    name: Frontend - typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build